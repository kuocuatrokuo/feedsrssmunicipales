name: Update RSS

on:
  schedule:
    - cron: "0 * * * *"  # cada hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 certifi papermill ipykernel lxml
      
      - name: Generate RSS (papermill)
        run: |
          rm -f rss.xml
          papermill "rss_pamplona.py.ipynb" "out.ipynb"

      - name: Debug - confirm rss.xml (must be new)
        run: |
          ls -la
          if [ ! -f rss.xml ]; then
            echo "ERROR: rss.xml NO se ha generado al ejecutar el notebook."
            exit 1
          fi
          echo "lastBuildDate en rss.xml:"
          grep -n "lastBuildDate" rss.xml || true

      - name: Commit updated RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update RSS"
          git push
